name: update-pool

on:
  schedule:
    - cron: "0 */3 * * *"   # каждые 3 часа
  workflow_dispatch:         # и вручную кнопкой

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install aiohttp
      - run: python aggregate.py --pool-out pool.txt --pool-size 300
      - run: |
          git config user.name "pool-bot"
          git config user.email "pool-bot@users.noreply.github.com"
          git add pool.txt
          git diff --cached --quiet || git commit -m "update pool"
          git push
